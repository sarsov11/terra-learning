<style>
:root{--bg:#FFFFFF;--panel:#F5F3F3;--line:#E4DFDF;--ink:#111111;--sub:#4B5563;--red:#C8102E;--red-soft:#FCE9EC;--ok:#15803D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:500;line-height:1.5;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 48px)}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;line-height:0}
.logo svg{height:40px;width:auto}
h1{font-size:clamp(26px,5.4vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1.2;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--sub);font-size:16px;font-weight:600}
a{color:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:9px 16px;background:var(--panel);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--panel);text-decoration:none;min-height:118px}
.item b{font-size:18px;font-weight:900}
.item small{font-size:13.5px;color:var(--sub);font-weight:600}
.item .go{margin-top:auto;font-weight:900;color:var(--red);font-size:14px}
.item.off{background:transparent;border:2px dashed var(--line)}
.item.off .go{color:var(--sub)}
.item .links{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.item .links a{font-weight:900;color:var(--red);font-size:14px;text-decoration:none;padding:7px 12px;border-radius:99px;background:var(--red-soft)}
.item .links .off{font-weight:800;color:var(--sub);font-size:14px;padding:7px 12px;border-radius:99px;border:1.5px dashed var(--line)}
a.item:hover{background:var(--red-soft)}
.brand{font-size:12.5px;font-weight:800;color:var(--red)}
.field{display:flex;flex-direction:column;gap:10px}
.field h2{margin:0;font-size:21px;font-weight:900;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.field h2 span{font-size:13.5px;color:var(--sub);font-weight:700}
/* B */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.who button{font:inherit;text-align:left;border:0;border-radius:16px;background:var(--panel);padding:18px 16px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.who button b{font-size:19px;font-weight:900}
.who button small{font-size:13px;color:var(--sub);font-weight:700}
.who button[aria-pressed="true"]{background:var(--ink);color:#fff}
.who button[aria-pressed="true"] small{color:#D1D5DB}
/* C */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:700;padding:15px 16px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.li b{font-size:17px;font-weight:900}
.li small{display:block;color:var(--sub);font-size:13px;font-weight:600}
.tag{font-size:12.5px;font-weight:900;padding:3px 10px;border-radius:6px;white-space:nowrap}
.tag.on{background:var(--red);color:#fff}
.tag.off{background:var(--panel);color:var(--sub)}
.empty{color:var(--sub);font-weight:700;padding:16px 2px}
nav.sian{display:flex;gap:6px;flex-wrap:wrap;background:#111;padding:8px;border-radius:12px}
nav.sian a{color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:6px 12px;border-radius:8px}
nav.sian a[aria-current="true"]{background:var(--red)}
footer{color:var(--sub);font-size:13px;font-weight:600;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>

const LOGO = LOGOS[new URLSearchParams(location.search).get('logo')] || LOGOS['1'];
const head = `<header><a class="logo" href="./" aria-label="테라러닝">${LOGO}</a></header>`;
const bar = SIAN ? `<nav class="sian" aria-label="시안">${[['a','A 분야 칩'],['b','B 나는 누구'],['c','C 검색']].map(([k,l])=>`<a href="#${k}" aria-current="${k===V}">${l}</a>`).join('')}</nav>` : '';
const foot = bar + `<footer>© 테라러닝 · 기출 문항은 시행기관이 공개한 자료에서 가져오고 출처를 적어요.</footer>`;

function viewA(){
  let pick = FIELDS[0].id;
  const draw = () => {
    const f = FIELDS.find(f=>f.id===pick);
    app.innerHTML = `${head}
      <h1>모두의 시험</h1>
      <p class="lead">수능부터 9급 공채, 건축기사, 세무사 1차까지.</p>
      <div class="chips" role="toolbar" aria-label="분야">${FIELDS.map(f=>`<button type="button" data-f="${f.id}" aria-pressed="${f.id===pick}">${esc(f.이름)}</button>`).join('')}</div>
      <section class="field"><h2>${esc(f.브랜드)}<span>${esc(f.대상)}</span></h2>
        <div class="grid">${f.종목.map(x=>item(x)).join('')}</div></section>${foot}`;
  };
  app.addEventListener('click', e=>{ const b=e.target.closest('[data-f]'); if(b){ pick=b.dataset.f; draw(); }});
  draw();
}

function viewB(){
  let pick = null;
  const draw = () => {
    const f = FIELDS.find(f=>f.id===pick);
    app.innerHTML = `${head}
      <h1>어떤 시험을 준비하세요?</h1>
      <div class="who">${FIELDS.map(f=>`<button type="button" data-f="${f.id}" aria-pressed="${f.id===pick}"><b>${esc(f.이름)}</b><small>${esc(f.대상)}</small></button>`).join('')}</div>
      ${f ? `<section class="field"><h2>${esc(f.브랜드)}</h2><div class="grid">${f.종목.map(x=>item(x)).join('')}</div></section>`
          : ''}${foot}`;
  };
  app.addEventListener('click', e=>{ const b=e.target.closest('[data-f]'); if(b){ pick=b.dataset.f; draw(); }});
  draw();
}

function viewC(){
  const all = FIELDS.flatMap(f=>f.종목.map(x=>({...x, 분야:f.이름, 브랜드:f.브랜드})));
  app.innerHTML = `${head}
    <h1>시험 이름으로 찾기</h1>
    <div class="search"><label for="q" class="lead" style="position:absolute;left:-9999px">시험 이름</label>
      <input id="q" type="search" placeholder="예: 군무원, 중개사, 지게차" autocomplete="off"></div>
    <div class="list" id="list"></div>${foot}`;
  const list = document.getElementById('list');
  const draw = q => {
    const hit = all.filter(x => !q || (x.이름+x.설명+x.분야+x.브랜드).replace(/\s/g,'').includes(q.replace(/\s/g,'')));
    hit.sort((a,b)=>(열림(b)-열림(a)));
    list.innerHTML = hit.length ? hit.map(x => 열림(x)
      ? `<a class="li" href="${esc(x.주소)}"><div><b>${esc(x.이름)}</b><small>${esc(x.브랜드)} · ${esc(x.설명||x.분야)}</small></div><span class="tag on">시작하기</span></a>`
      : `<div class="li"><div><b>${esc(x.이름)}</b><small>${esc(x.브랜드)} · ${esc(x.설명||x.분야)}</small></div><span class="tag off">준비 중</span></div>`).join('')
      : `<div class="empty">일치하는 시험이 없어요.</div>`;
  };
  document.getElementById('q').addEventListener('input', e=>draw(e.target.value.trim()));
  draw('');
}

({a:viewA, b:viewB, c:viewC}[V] || viewA)();
