    var unis = DB.대학.filter(function (u) { return by[u.id]; });
    $("sum").innerHTML = rows.length
      ? "<b>" + unis.length + "</b><span>개 대학</span><b>" + rows.length + "</b><span>개 모집단위</span><b>" + nf(수시) + "</b><span>명 수시</span><b>" + nf(정시) + "</b><span>명 정시</span>"
      : "";
    $("list").innerHTML = rows.length ? unis.map(function (u) {
      var rs = by[u.id], n = rs.reduce(function (a, r) { return a + Object.keys(r.인원).reduce(function (b, k) { return b + r.인원[k]; }, 0); }, 0);
      return '<section class="uni"><div class="uni-h"><b>' + esc(u.이름) + "</b><small>" + rs.length + "개 단위 · " + nf(n) + "명</small></div>" +
        rs.map(function (r) {
          var sum = Object.keys(r.인원).reduce(function (b, k) { return b + r.인원[k]; }, 0);
          var tags = tagsOf(r).map(function (t) { return '<span class="t' + (t.jeong ? " jeong" : "") + '">' + esc(t.lab) + " " + t.n + "</span>"; }).join("");
          if (r.캠) tags = '<span class="t">' + esc(r.캠) + "</span>" + tags;
          if (r.검증 === "합계불일치") tags += '<span class="t chk" title="전형별 인원의 합이 PDF 표의 계와 다릅니다">PDF 계와 다름 · 확인 중</span>';
          var det = Object.keys(r.인원).map(function (k) {
            var t = 전형[r.u][k] || {};
            return "<tr><td>" + esc((t.시기 || "") + " · " + (t.전형명 || k) + (t.군 ? " (" + t.군 + "군)" : "")) + '</td><td class="n">' + r.인원[k] + "</td></tr>";
          }).join("");
          var src = u.PDF ? '<a href="' + esc(u.PDF) + '" target="_blank" rel="noopener">시행계획 원문' + (r.쪽 ? " " + r.쪽 + "쪽" : "") + "</a>" : "";
          return '<details class="u"><summary><div class="nm"><b>' + esc(r.단위) + "</b>" + (r.단과 && r.단과 !== r.단위 ? "<small>" + esc(r.단과) + "</small>" : "") +
            '</div><span class="tot">' + nf(sum) + "명</span><div class=\"tags\">" + tags + "</div></summary>" +
            '<div class="detail"><table>' + det + "</table><span class=\"src\">" + src + (r.계 != null ? " · PDF 표의 계 " + r.계 + "명" : "") + "</span></div></details>";
        }).join("") + "</section>";
    }).join("") : '<div class="empty">조건에 맞는 모집단위가 없습니다. 전공 이름을 짧게 넣거나 계열을 바꿔 보세요.</div>';
  }

  function drawStatus() {
    $("status").innerHTML = "<table><thead><tr><th>대학</th><th>묶음</th><th style=\"text-align:right\">모집단위</th><th style=\"text-align:right\">계 일치</th><th>받은 날</th><th>원문</th></tr></thead><tbody>" +
      DB.대학.map(function (u) {
        var ok = u.행수 ? u.합계일치 + "/" + u.행수 : "—";
        return "<tr><td>" + esc(u.이름) + (u.비고 && !u.행수 ? '<br><small style="color:var(--sub);font-weight:600">' + esc(u.비고) + "</small>" : "") + "</td><td>" + esc(u.묶음) + '</td><td class="n">' + (u.행수 || (u.비고 ? "—" : "정리 중")) + '</td><td class="n">' + ok +
          "</td><td>" + esc((u.받은때 || "").slice(0, 10)) + "</td><td>" + (u.PDF ? '<a href="' + esc(u.PDF) + '" target="_blank" rel="noopener">PDF</a>' : "") + "</td></tr>";
      }).join("") + "</tbody></table>";
    var f = $("foot").firstElementChild;
    f.textContent = f.textContent + " 마지막 갱신: " + (DB.만든때 || "").slice(0, 10) + ".";
  }

  $("app").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-f],button[data-g],button[data-t]"); if (!b) return;
    if (b.dataset.f) { S.f = b.dataset.f; S.q = ""; $("q").value = ""; }
    if (b.dataset.g) S.g = b.dataset.g;
    if (b.dataset.t) S.t = (유형들.filter(function (x) { return x[0] === b.dataset.t; })[0] || [0, null])[1];
    draw();
  });
  $("q").value = S.q || "";
  $("q").addEventListener("input", function (e) { S.q = e.target.value.trim(); draw(); });

  draw();
  $("list").innerHTML = '<div class="empty">모집단위 자료를 불러오는 중입니다.</div>';
  fetch("data/2028.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    DB = d;
    d.대학.forEach(function (u) { 대학[u.id] = u; 전형[u.id] = {}; (u.전형 || []).forEach(function (t) { 전형[u.id][t.key] = t; }); });
    drawStatus(); draw();
  }).catch(function () {
    $("list").innerHTML = '<div class="empty">자료를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>';
  });
})();
</script>
</body>
</html>
